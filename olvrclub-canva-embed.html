      function CheckinView({ events, regs, onSuccess }){
        const [eventId, setEventId] = useState(events[0]?.id || "");
        const [input, setInput] = useState("");
        const [result, setResult] = useState(null);
        const [scanning, setScanning] = useState(false);
        const videoRef = React.useRef(null);
        const rafRef = React.useRef(0);
        const streamRef = React.useRef(null);

        const stopScan = () => {
          setScanning(false);
          try { cancelAnimationFrame(rafRef.current); } catch {}
          try { streamRef.current?.getTracks?.().forEach(t=> t.stop()); } catch {}
          streamRef.current = null;
        };
        const loopDetect = async () => {
          if (!scanning) return;
          try {
            const el = videoRef.current;
            if (el && el.readyState >= 2) {
              if (window.BarcodeDetector) {
                const detector = new window.BarcodeDetector({ formats:["qr_code"] });
                const codes = await detector.detect(el);
                if (codes && codes[0]?.rawValue) { setInput(codes[0].rawValue); stopScan(); }
              }
            }
          } catch {}
          rafRef.current = requestAnimationFrame(loopDetect);
        };
        const startScan = async () => {
          try {
            if (!navigator.mediaDevices?.getUserMedia) throw new Error("no camera api");
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            streamRef.current = stream;
            if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
            setScanning(true); loopDetect();
          } catch (e) { alert("อุปกรณ์นี้ไม่รองรับการสแกนในเว็บ กรุณาใช้แอปสแกนแล้วคัดลอกโค้ดมาแปะ"); }
        };
        const tryCheck = () => {
          const p = parseTicketPayload(input.trim());
          if (!p) { setResult({ ok:false, msg:"QR ไม่ถูกต้อง" }); return; }
          const reg = regs.find(r=> r.id===p.id && r.eventId===p.ev && r.token===p.t);
          if (!reg) { setResult({ ok:false, msg:"ไม่พบผู้ลงทะเบียนในกิจกรรมนี้" }); return; }
          if (eventId && reg.eventId !== eventId) { setResult({ ok:false, msg:"QR ไม่ตรงกับกิจกรรมที่เลือก" }); return; }
          onSuccess(reg.id); setResult({ ok:true, name: reg.name, time: new Date().toLocaleString() });
        };

        return React.createElement(Card, { className:'rounded-2xl shadow-sm' },
          React.createElement(CardContent, { className:'p-6 space-y-4' },
            React.createElement('div', { className:'grid md:grid-cols-2 gap-4' },
              React.createElement('div', { className:'space-y-3' },
                React.createElement('div', null,
                  React.createElement(Label, null, 'เลือกกิจกรรม'),
                  React.createElement(Select, { value: eventId, onValueChange: setEventId },
                    React.createElement(SelectTrigger, { className:'mt-1' }, React.createElement(SelectValue)),
                    React.createElement(SelectContent, null, events.map(e=> React.createElement(SelectItem, { key:e.id, value:e.id }, \`\${toDateThai(e.date)} — \${e.title}\`)))
                  )
                ),
                React.createElement('div', null,
                  React.createElement(Label, null, 'วาง/สแกนโค้ดจาก QR'),
                  React.createElement(Textarea, { className:'mt-1', rows:4, placeholder:'วางข้อความโค้ดที่สแกนได้จาก QR ที่สมาชิกแสดง', value:input, onChange:(e)=> setInput(e.target.value) })
                ),
                React.createElement('div', { className:'flex gap-2' },
                  React.createElement(Button, { onClick: tryCheck }, React.createElement(Lucide.CheckCheck, { className:'w-4 mr-2 inline' }), 'เช็คอิน'),
                  !scanning
                    ? React.createElement(Button, { variant:'secondary', onClick: startScan }, React.createElement(Lucide.Camera, { className:'w-4 mr-2 inline' }), 'เปิดกล้องสแกน')
                    : React.createElement(Button, { variant:'destructive', onClick: stopScan }, React.createElement(Lucide.StopCircle, { className:'w-4 mr-2 inline' }), 'หยุดสแกน')
                ),
                React.createElement('p', { className:'text-xs text-slate-500' }, '* รองรับการสแกนผ่านกล้อง (ถ้าเบราว์เซอร์รองรับ) หรือใช้แอปสแกนแล้วคัดลอกโค้ดมาแปะเพื่อตรวจสอบ')
              ),
              React.createElement('div', { className:'rounded-2xl bg-slate-50 p-4 border' },
                React.createElement('h4', { className:'font-semibold mb-2' }, 'ผลการตรวจสอบ'),
                !result && React.createElement('div', { className:'text-sm text-slate-500' }, 'ยังไม่มีข้อมูล'),
                result && (result.ok
                  ? React.createElement('div', { className:'text-sm text-emerald-700' }, 'เช็คอินสำเร็จ ✅', React.createElement('br'), 'ผู้เข้าร่วม: ', React.createElement('span', { className:'font-medium' }, result.name), React.createElement('br'), 'เวลา: ', result.time)
                  : React.createElement('div', { className:'text-sm text-rose-700' }, '❌ ', result.msg)
                ),
                scanning && React.createElement('div', { className:'mt-4 overflow-hidden rounded-xl border bg-black/90' },
                  React.createElement('video', { ref: videoRef, className:'w-full h-64 object-cover', playsInline:true, muted:true })
                )
